name: Music Studio combined Draft baseline verification
on:
  push:
    branches:
      - verification/music-studio-baseline-combined
      - verification/music-studio-all-drafts-255
  workflow_dispatch:

jobs:
  full-node-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Entire repository Node test suite (required)
        run: node --test
      - name: All repository JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Python local HTTP boundary regression
        run: python3 -m unittest discover -s tools/music-audio-pipeline -p 'test_*.py' -v
      - name: Audio helper shell syntax
        run: bash -n tools/music-audio-pipeline/START_AUDIO_PIPELINE.command tools/music-audio-pipeline/STOP_AUDIO_PIPELINE.command tools/music-audio-pipeline/mac-app/NovaMusicAudioHelper
      - name: Full integration whitespace integrity against main
        run: git diff --check origin/main...HEAD
