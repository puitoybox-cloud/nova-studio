name: Dynamic Track Recording Verify
on:
  push:
    branches:
      - agent/music-studio-dynamic-track-recording-routing
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node tests
        run: node --test
      - name: JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Diff whitespace diagnostics
        shell: bash
        run: |
          set +e
          git diff --check 970b9563ac4a0ddd25086434494ff1087e862108...HEAD 2>&1 | tee /tmp/diff-check.log
          echo ${PIPESTATUS[0]} > /tmp/diff-check.status
          exit 0
      - name: Upload diff diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: diff-check-log
          path: /tmp/diff-check.*
      - name: Require diff green
        run: test "$(cat /tmp/diff-check.status)" = "0"
      - name: Clean worktree
        run: test -z "$(git status --porcelain)"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Responsive browser smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nova-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node scripts/music-studio-dynamic-track-recording-browser-smoke.js
