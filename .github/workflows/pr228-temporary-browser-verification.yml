name: PR 228 temporary browser verification

on:
  push:
    branches:
      - agent/music-studio-dynamic-track-playback-routing

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node scripts/music-studio-dynamic-track-playback-browser-smoke.js
