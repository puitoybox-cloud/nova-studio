name: Music Audio real conversion accuracy
on:
  push:
    branches: [verification/music-studio-all-drafts-255]
    paths:
      - 'tools/music-audio-pipeline/**'
      - '.github/workflows/music-audio-real-conversion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual Audio Helper dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/real-audio-venv"
          "$RUNNER_TEMP/real-audio-venv/bin/python" -m pip install -r tools/music-audio-pipeline/requirements.txt
      - name: Run WAV through Demucs, Basic Pitch, and merged MIDI
        run: |
          "$RUNNER_TEMP/real-audio-venv/bin/python" tools/music-audio-pipeline/verify_real_conversion.py "$RUNNER_TEMP/real-audio-result"
      - name: Upload actual MIDI and note report, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PR262-Real-Audio-Conversion-${{ github.sha }}
          path: ${{ runner.temp }}/real-audio-result/
          if-no-files-found: warn
          retention-days: 14
