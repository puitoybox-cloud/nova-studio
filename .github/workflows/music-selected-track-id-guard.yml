name: Music Selected Track ID Guard
on:
  push:
    branches:
      - agent/music-selected-track-invalid-id-guard
  pull_request:
    paths:
      - 'music-studio-editor.js'
      - 'tests/music-studio-selected-track-id.test.js'
      - '.github/workflows/music-selected-track-id-guard.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Exact Track ID regression
        run: node --test tests/music-studio-selected-track-id.test.js
      - name: Repository JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Whitespace integrity
        run: git diff --check HEAD^ HEAD
