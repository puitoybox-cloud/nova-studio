name: Music IndexedDB browser persistence
on:
  pull_request:
    paths:
      - 'music-studio.js'
      - 'tests/music-indexeddb-browser-persistence.test.cjs'
      - '.github/workflows/music-indexeddb-browser-persistence.yml'
  workflow_dispatch:
jobs:
  chromium-indexeddb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright and Chromium
        run: |
          mkdir -p /tmp/nova-browser-test
          npm install --prefix /tmp/nova-browser-test --no-audit --no-fund playwright@1.58.2
          /tmp/nova-browser-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Check Music Studio JavaScript syntax
        run: node --check music-studio.js
      - name: Verify persistent IndexedDB across Chromium restart
        env:
          NODE_PATH: /tmp/nova-browser-test/node_modules
        run: node --test tests/music-indexeddb-browser-persistence.test.cjs
