name: Music song checkpoints and complete recovery
on:
  pull_request:
    paths:
      - 'music-studio.js'
      - 'music-studio.html'
      - 'tests/music-song-checkpoints.test.js'
      - 'scripts/music-song-checkpoints-browser.js'
      - 'scripts/music-pcm-journal-crash-browser.js'
      - 'scripts/music-encoded-journal-crash-browser.js'
      - 'tests/music-studio-vocal-recording.test.js'
      - '.github/workflows/music-song-checkpoints.yml'
permissions:
  contents: read
jobs:
  checkpoint-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/music-song-checkpoints.test.js
      - name: Japanese UI fonts
        timeout-minutes: 6
        run: |
          # Two exact-head attempts stalled downloading the 61 MB CJK package
          # from the Azure HTTP mirror. Keep signed Ubuntu packages and the
          # real Japanese-font UI assertions; use the official HTTPS archive.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo timeout 240s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --download-only fonts-noto-cjk
          sudo apt-get --no-download install -y fonts-noto-cjk
          checkpoint_font_family="$(fc-match -f '%{family}' 'Noto Sans CJK JP')"
          [[ "$checkpoint_font_family" == *"Noto Sans CJK JP"* ]]
      - run: npm install --prefix "$RUNNER_TEMP/checkpoint-browser" playwright
      - name: Browser UI, restart and complete recovery
        env:
          NODE_PATH: ${{ runner.temp }}/checkpoint-browser/node_modules
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          NOVA_TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/music-song-checkpoints-browser.js
      - name: Recording PCM survives Chromium SIGKILL and fresh process recovery
        env:
          NODE_PATH: ${{ runner.temp }}/checkpoint-browser/node_modules
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: node scripts/music-pcm-journal-crash-browser.js
      - name: MediaRecorder SIGKILL recovery and unfinished archive migration
        env:
          NODE_PATH: ${{ runner.temp }}/checkpoint-browser/node_modules
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: node scripts/music-encoded-journal-crash-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-song-checkpoint-recovery
          path: |
            verification/music-song-checkpoints-browser.json
            verification/music-pcm-journal-crash-browser.json
            verification/music-encoded-journal-crash-browser.json
            verification/music-checkpoint-*.png
