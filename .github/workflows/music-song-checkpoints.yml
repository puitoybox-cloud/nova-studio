name: Music song checkpoints and complete recovery
on:
  pull_request:
    paths:
      - 'tools/music-local-generation/prepare.py'
      - 'music-studio.js'
      - 'scripts/music-chromium-devtools-port.cjs'
      - 'music-studio.html'
      - 'tests/music-song-checkpoints.test.js'
      - 'scripts/music-song-checkpoints-browser.js'
      - 'scripts/music-finished-immutability-browser.js'
      - 'scripts/music-pcm-journal-crash-browser.js'
      - 'scripts/music-recovered-take-comp-browser.js'
      - 'scripts/music-journal-transaction-crash-browser.js'
      - 'scripts/music-encoded-journal-crash-browser.js'
      - 'tests/music-studio-vocal-recording.test.js'
      - '.github/workflows/music-song-checkpoints.yml'
permissions:
  contents: read
jobs:
  checkpoint-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/music-song-checkpoints.test.js
      - name: Japanese UI fonts
        timeout-minutes: 6
        run: |
          if [[ "$(fc-match -f '%{family}' 'Noto Sans CJK JP')" != *"Noto Sans CJK JP"* ]]; then
            sources="$(mktemp --suffix=.list)"
            trap 'rm -f "$sources"' EXIT
            chmod 644 "$sources"
            printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main' > "$sources"
            apt_source=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::https::Timeout=30)
            # Use only the explicit signed archive, independent of runner mirror configuration.
            sudo apt-get "${apt_source[@]}" update
            sudo timeout 180s apt-get "${apt_source[@]}" install -y fonts-noto-cjk
          fi
          [[ "$(fc-match -f '%{family}' 'Noto Sans CJK JP')" == *"Noto Sans CJK JP"* ]]
      - id: browser-setup
        if: ${{ !cancelled() }}
        run: npm install --prefix "$RUNNER_TEMP/checkpoint-browser" playwright
      - name: Browser UI, restart and complete recovery
        env:
          NODE_PATH: ${{ runner.temp }}/checkpoint-browser/node_modules
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          NOVA_TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/music-song-checkpoints-browser.js
      - name: Finished snapshots reject every replacement sink and reopen intact
        if: ${{ !cancelled() && steps.browser-setup.outcome == 'success' }}
        env:
          NODE_PATH: ${{ runner.temp }}/checkpoint-browser/node_modules
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          NOVA_TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/music-finished-immutability-browser.js
      - name: Recording PCM survives Chromium SIGKILL and fresh process recovery
        if: ${{ !cancelled() && steps.browser-setup.outcome == 'success' }}
        env:
          NODE_PATH: ${{ runner.temp }}/checkpoint-browser/node_modules
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: node scripts/music-pcm-journal-crash-browser.js
      - name: MediaRecorder SIGKILL recovery and unfinished archive migration
        if: ${{ !cancelled() && steps.browser-setup.outcome == 'success' }}
        env:
          NODE_PATH: ${{ runner.temp }}/checkpoint-browser/node_modules
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: node scripts/music-encoded-journal-crash-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-song-checkpoint-recovery
          path: |
            verification/music-finished-immutability-browser.json
            verification/music-song-checkpoints-browser.json
            verification/music-pcm-journal-crash-browser.json
            verification/music-encoded-journal-crash-browser.json
            verification/music-checkpoint-*.png
