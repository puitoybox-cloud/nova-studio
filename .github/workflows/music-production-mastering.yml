name: Music production master loudness
on:
  pull_request:
    paths:
      - 'music-studio.js'
      - 'scripts/music-eight-minute-stems-browser.js'
      - '.github/workflows/music-production-mastering.yml'
permissions:
  contents: read
jobs:
  acoustic-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/stem-browser" playwright
      - name: Acoustic eight-minute production restore and export
        env:
          NODE_PATH: ${{ runner.temp }}/stem-browser/node_modules
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          NOVA_TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NOVA_HQ: '1'
        run: node scripts/music-eight-minute-stems-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-acoustic-mastering
          path: verification/music-eight-minute-stems-browser.json
