name: Music production master loudness
on:
  pull_request:
    paths:
      - 'tools/music-local-generation/prepare.py'
      - 'music-studio.js'
      - 'scripts/music-eight-minute-stems-browser.js'
      - '.github/workflows/music-production-mastering.yml'
      - 'scripts/music-production-comparison.js'
      - 'tests/music-production-comparison.test.js'
permissions:
  contents: read
jobs:
  acoustic-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/stem-browser" playwright
      - name: Prepare immutable same-runner baseline
        run: |
          git fetch --depth=1 origin 3a7852f1ea498c3570ad658c35808b4b982444e1
          git worktree add --detach "$RUNNER_TEMP/music-baseline" 3a7852f1ea498c3570ad658c35808b4b982444e1
          cp scripts/music-eight-minute-stems-browser.js "$RUNNER_TEMP/music-baseline/scripts/music-eight-minute-stems-browser.js"
      - name: Baseline acoustic eight-minute production
        env:
          NODE_PATH: ${{ runner.temp }}/stem-browser/node_modules
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          NOVA_TESTED_HEAD: 3a7852f1ea498c3570ad658c35808b4b982444e1
          NOVA_HQ: '1'
        run: |
          cd "$RUNNER_TEMP/music-baseline"
          node scripts/music-eight-minute-stems-browser.js
          cp verification/music-eight-minute-stems-browser.json "$GITHUB_WORKSPACE/verification/music-eight-minute-baseline.json"
      - name: Acoustic eight-minute production restore and export
        env:
          NODE_PATH: ${{ runner.temp }}/stem-browser/node_modules
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          NOVA_TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NOVA_HQ: '1'
        run: node scripts/music-eight-minute-stems-browser.js
      - name: Compare unchanged audio and corrected peak-meter contracts
        run: |
          node scripts/music-production-comparison.js verification/music-eight-minute-baseline.json verification/music-eight-minute-stems-browser.json verification/music-eight-minute-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-acoustic-mastering
          path: |
            verification/music-eight-minute-stems-browser.json
            verification/music-eight-minute-baseline.json
            verification/music-eight-minute-comparison.json
