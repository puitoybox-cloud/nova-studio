name: Music Native Wrapper Swift

on:
  push:
    branches:
      - main
      - agent/music-studio-current-main-build-verification
      - verification/music-studio-all-drafts-255
    paths:
      - 'tools/music-native-wrapper/**'
      - 'tools/music-audio-pipeline/*.py'
      - 'music-studio-audio-pipeline.js'
      - '.github/workflows/music-native-wrapper-swift.yml'
  pull_request:
    paths:
      - 'tools/music-native-wrapper/**'
      - 'tools/music-audio-pipeline/*.py'
      - 'music-studio-audio-pipeline.js'
      - '.github/workflows/music-native-wrapper-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Swift version
        run: swift --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Build native wrapper package
        working-directory: tools/music-native-wrapper
        run: swift build

      - name: Test native wrapper package
        working-directory: tools/music-native-wrapper
        run: swift test

      - name: Build Swift package app target
        working-directory: tools/music-native-wrapper
        run: swift build --product MusicStudioNativeApp

      - name: Build macOS Xcode app target
        working-directory: tools/music-native-wrapper
        run: xcodebuild -project MusicStudioNative.xcodeproj -scheme MusicStudioMac -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Build iPad simulator Xcode app target
        working-directory: tools/music-native-wrapper
        run: xcodebuild -project MusicStudioNative.xcodeproj -scheme MusicStudioiPad -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/iPadDerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Record actual native package architecture and linkage
        working-directory: tools/music-native-wrapper
        shell: bash
        run: |
          set -euo pipefail
          MAC_APP="build/DerivedData/Build/Products/Debug/Music Studio.app"
          IPAD_APP="build/iPadDerivedData/Build/Products/Debug-iphonesimulator/Music Studio.app"
          python3 ../music-audio-pipeline/bundle_evidence.py --package-root "$MAC_APP" --scope PACKAGE_OBSERVATION > macos-package-evidence.json
          python3 ../music-audio-pipeline/bundle_evidence.py --package-root "$IPAD_APP" --scope PACKAGE_OBSERVATION > ipad-simulator-package-evidence.json
          MAC_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$MAC_APP/Contents/Info.plist")
          IPAD_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$IPAD_APP/Info.plist")
          {
            printf 'macOS actual binary architectures:\n'
            /usr/bin/lipo -archs "$MAC_APP/Contents/MacOS/$MAC_EXEC"
            /usr/bin/file "$MAC_APP/Contents/MacOS/$MAC_EXEC"
            /usr/bin/otool -L "$MAC_APP/Contents/MacOS/$MAC_EXEC"
            printf 'iPad Simulator actual binary architectures (not physical iPad evidence):\n'
            /usr/bin/lipo -archs "$IPAD_APP/$IPAD_EXEC"
            /usr/bin/file "$IPAD_APP/$IPAD_EXEC"
            /usr/bin/otool -L "$IPAD_APP/$IPAD_EXEC"
          } > native-architecture-linkage-evidence.txt
          cat native-architecture-linkage-evidence.txt

      - name: Observe Wrapper build without approving production assets
        working-directory: tools/music-native-wrapper
        env:
          WRAPPER_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PYOBS'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('../music-audio-pipeline').resolve()))
          from wrapper_build_inventory import observe
          report = observe('build/DerivedData/Build/Products/Debug/Music Studio.app',
                           os.environ['WRAPPER_BUILD_REVISION'], 'x86_64')
          assert report['status'] == 'INCOMPLETE' and report['complete'] is False
          assert report['approvedAnchor'] is False and report['publicationEligible'] is False
          assert report['observedGraph'] is not None and report['files'] and report['nativeImages']
          assert all(node['evidence'] == 'OBSERVED_METADATA_ONLY' and
                     node['licenseStatus'] == 'REVIEW_REQUIRED' for node in report['observedGraph']['nodes'])
          assert all(slot['status'] == 'MISSING' for slot in report['missingApprovedAssets'])
          Path('wrapper-build-inventory.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({'status': report['status'], 'complete': report['complete'],
              'fileCount': len(report['files']), 'nativeImageCount': len(report['nativeImages']),
              'graphNodeCount': len(report['observedGraph']['nodes']),
              'missingApprovedAssets': report['missingApprovedAssets'], 'approvedAnchor': False,
              'publicationEligible': False, 'buildRevision': report['buildRevision']}))
          PYOBS

      - uses: actions/upload-artifact@v4
        with:
          name: Native-package-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tools/music-native-wrapper/macos-package-evidence.json
            tools/music-native-wrapper/ipad-simulator-package-evidence.json
            tools/music-native-wrapper/native-architecture-linkage-evidence.txt
            tools/music-native-wrapper/wrapper-build-inventory.json
          if-no-files-found: error
          retention-days: 7

      - name: Package macOS app for real-device verification
        working-directory: tools/music-native-wrapper
        run: |
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > MUSIC_STUDIO_NATIVE_EXACT_HEAD.txt
          ditto -c -k --sequesterRsrc --keepParent "build/DerivedData/Build/Products/Debug/Music Studio.app" "MusicStudioMac-Exact-Head.zip"

      - name: Upload macOS app verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicStudioMac-Exact-Head-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tools/music-native-wrapper/MusicStudioMac-Exact-Head.zip
            tools/music-native-wrapper/MUSIC_STUDIO_NATIVE_EXACT_HEAD.txt
          if-no-files-found: error
          retention-days: 7
