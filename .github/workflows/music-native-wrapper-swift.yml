name: Music Native Wrapper Swift

on:
  push:
    branches:
      - main
      - agent/music-studio-current-main-build-verification
      - verification/music-studio-all-drafts-255
    paths:
      - 'tools/music-native-wrapper/**'
      - '.github/workflows/music-native-wrapper-swift.yml'
  pull_request:
    paths:
      - 'tools/music-native-wrapper/**'
      - '.github/workflows/music-native-wrapper-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Build native wrapper package
        working-directory: tools/music-native-wrapper
        run: swift build

      - name: Test native wrapper package
        working-directory: tools/music-native-wrapper
        run: swift test

      - name: Build Swift package app target
        working-directory: tools/music-native-wrapper
        run: swift build --product MusicStudioNativeApp

      - name: Build macOS Xcode app target
        working-directory: tools/music-native-wrapper
        run: xcodebuild -project MusicStudioNative.xcodeproj -scheme MusicStudioMac -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Build iPad simulator Xcode app target
        working-directory: tools/music-native-wrapper
        run: xcodebuild -project MusicStudioNative.xcodeproj -scheme MusicStudioiPad -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Package macOS app for real-device verification
        working-directory: tools/music-native-wrapper
        run: |
          printf '%s\n' "${GITHUB_SHA}" > MUSIC_STUDIO_NATIVE_EXACT_HEAD.txt
          ditto -c -k --sequesterRsrc --keepParent "build/DerivedData/Build/Products/Debug/Music Studio.app" "MusicStudioMac-Exact-Head.zip"

      - name: Upload macOS app verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicStudioMac-Exact-Head-${{ github.sha }}
          path: |
            tools/music-native-wrapper/MusicStudioMac-Exact-Head.zip
            tools/music-native-wrapper/MUSIC_STUDIO_NATIVE_EXACT_HEAD.txt
          if-no-files-found: error
          retention-days: 7
