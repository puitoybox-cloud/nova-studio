name: Music Native Wrapper Swift

on:
  push:
    branches:
      - agent/music-studio-core-midi-wrapper-foundation
      - agent/music-studio-native-app-shell
      - agent/music-studio-native-app-target-foundation
      - agent/music-studio-xcode-app-foundation
    paths:
      - 'tools/music-native-wrapper/**'
      - '.github/workflows/music-native-wrapper-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Build native wrapper package
        working-directory: tools/music-native-wrapper
        run: swift build

      - name: Test native wrapper package
        working-directory: tools/music-native-wrapper
        run: swift test

      - name: Build Swift package app target
        working-directory: tools/music-native-wrapper
        run: swift build --product MusicStudioNativeApp

      - name: Build macOS Xcode app target
        working-directory: tools/music-native-wrapper
        run: xcodebuild -project MusicStudioNative.xcodeproj -scheme MusicStudioMac -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Build iPad simulator Xcode app target
        working-directory: tools/music-native-wrapper
        run: xcodebuild -project MusicStudioNative.xcodeproj -scheme MusicStudioiPad -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
