name: Music Native Wrapper Swift

on:
  push:
    branches:
      - agent/music-studio-core-midi-wrapper-foundation
      - agent/music-studio-native-app-shell
      - agent/music-studio-native-app-target-foundation
      - agent/music-studio-xcode-app-foundation
      - agent/music-studio-native-web-midi-shim
    paths:
      - 'tools/music-native-wrapper/**'
      - '.github/workflows/music-native-wrapper-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Test native wrapper package
        working-directory: tools/music-native-wrapper
        run: swift test

      - name: Build Swift package app target
        working-directory: tools/music-native-wrapper
        run: swift build --product MusicStudioNativeApp

      - name: Build macOS Xcode app target
        working-directory: tools/music-native-wrapper
        run: xcodebuild -project MusicStudioNative.xcodeproj -target MusicStudioMac -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Build iPad simulator Xcode app target
        working-directory: tools/music-native-wrapper
        run: xcodebuild -project MusicStudioNative.xcodeproj -target MusicStudioiPad -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

      - name: Package macOS app for real-device verification
        working-directory: tools/music-native-wrapper
        run: |
          printf '%s\n' "${GITHUB_SHA}" > PR248_EXACT_HEAD.txt
          ditto -c -k --sequesterRsrc --keepParent "build/Debug/Music Studio.app" "MusicStudioMac-PR248.zip"

      - name: Upload macOS app verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicStudioMac-PR248-${{ github.sha }}
          path: |
            tools/music-native-wrapper/MusicStudioMac-PR248.zip
            tools/music-native-wrapper/PR248_EXACT_HEAD.txt
          if-no-files-found: error
          retention-days: 7
