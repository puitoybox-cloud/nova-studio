name: Music Native Wrapper Swift

on:
  push:
    branches:
      - agent/music-studio-core-midi-wrapper-foundation
      - agent/music-studio-native-app-shell
      - agent/music-studio-native-app-target-foundation
      - agent/music-studio-xcode-app-foundation
      - agent/music-studio-native-web-midi-shim
      - verification/pr248-native-midi-diagnostics
    paths:
      - 'tools/music-native-wrapper/**'
      - '.github/workflows/music-native-wrapper-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Build native wrapper package
        working-directory: tools/music-native-wrapper
        run: swift build

      - name: Test native wrapper package
        working-directory: tools/music-native-wrapper
        run: swift test

      - name: Build Swift package app target
        working-directory: tools/music-native-wrapper
        run: swift build --product MusicStudioNativeApp

      - name: Build macOS Xcode app target
        working-directory: tools/music-native-wrapper
        run: xcodebuild -project MusicStudioNative.xcodeproj -scheme MusicStudioMac -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Build iPad simulator Xcode app target
        working-directory: tools/music-native-wrapper
        run: xcodebuild -project MusicStudioNative.xcodeproj -scheme MusicStudioiPad -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Package macOS app for real-device verification
        working-directory: tools/music-native-wrapper
        run: |
          printf 'PRODUCT_HEAD=%s\nDIAGNOSTIC_COMMIT=%s\n' \
            'de9eaca4a8018fe6708d66cccaf0b708f441fdbf' \
            "${GITHUB_SHA}" > PR248_NATIVE_MIDI_DIAGNOSTICS.txt
          ditto -c -k --sequesterRsrc --keepParent \
            "build/DerivedData/Build/Products/Debug/Music Studio.app" \
            "MusicStudioMac-PR248-NativeMIDIDiagnostics.zip"

      - name: Upload macOS app verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicStudioMac-PR248-NativeMIDIDiagnostics-${{ github.sha }}
          path: |
            tools/music-native-wrapper/MusicStudioMac-PR248-NativeMIDIDiagnostics.zip
            tools/music-native-wrapper/PR248_NATIVE_MIDI_DIAGNOSTICS.txt
          if-no-files-found: error
          retention-days: 7
