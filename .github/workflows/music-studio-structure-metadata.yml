name: Music Studio structure metadata guard

on:
  pull_request:
    paths:
      - 'music-studio-midi-parser.js'
      - 'tests/music-studio-midi-parser.test.js'
      - '.github/workflows/music-studio-structure-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run MIDI parser regression tests
        run: node --test tests/music-studio-midi-parser.test.js
      - name: Run full Node test suite on PR head
        id: pr-full
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test 2>&1 | tee "$RUNNER_TEMP/pr-full.log"
      - name: Verify full-suite failures introduce no regression from main
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/main-baseline" "origin/${{ github.base_ref }}"
          (
            cd "$RUNNER_TEMP/main-baseline"
            node --test > "$RUNNER_TEMP/main-full.log" 2>&1 || true
          )
          sed -n 's/^not ok [0-9][0-9]* - /not ok - /p' "$RUNNER_TEMP/pr-full.log" | sort > "$RUNNER_TEMP/pr-failures.txt"
          sed -n 's/^not ok [0-9][0-9]* - /not ok - /p' "$RUNNER_TEMP/main-full.log" | sort > "$RUNNER_TEMP/main-failures.txt"
          echo "PR head failures:"
          cat "$RUNNER_TEMP/pr-failures.txt"
          echo "main baseline failures:"
          cat "$RUNNER_TEMP/main-failures.txt"
          diff -u "$RUNNER_TEMP/main-failures.txt" "$RUNNER_TEMP/pr-failures.txt"
      - name: Check all JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Check PR whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
