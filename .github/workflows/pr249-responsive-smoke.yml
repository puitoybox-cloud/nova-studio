name: PR249 Responsive Browser Smoke

on:
  push:
    branches:
      - verification/pr249-responsive-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify 1440 820 390 and console
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pr249-http.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            curl --silent --fail http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 1
          done
          node scripts/security-browser-smoke.js
          node scripts/pr249-ipad-layout-browser-smoke.js
