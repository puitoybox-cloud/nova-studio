name: Dynamic Track Core Space Verify
on:
  push:
    branches:
      - agent/music-studio-dynamic-track-recording-final-verify
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/music-studio-dynamic-track-recording-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: test "$(git rev-parse HEAD)" = "f4c130b20064a1e907a0ef28077db64ae9ccbb08"
      - run: node --test
      - run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - run: git diff --check 970b9563ac4a0ddd25086434494ff1087e862108...HEAD
      - run: test -z "$(git status --porcelain)"
      - run: npm init -y >/dev/null 2>&1 && npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nova-http.log 2>&1 &
          sleep 2
          node scripts/music-studio-dynamic-track-recording-browser-smoke.js
