name: PR250 pointer temporary verification
on:
  push:
    branches: [agent/music-studio-ipad-piano-touch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test
      - name: node check all JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
      - name: diff check
        run: git diff --check ec59f2176803b37b1ae934828cfc46e656e699e2 HEAD
