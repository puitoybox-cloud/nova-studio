name: NOVA AU actual Intel binary
on:
  pull_request:
    paths:
      - 'tools/nova-au/**'
      - 'music-studio-logic-instruments.js'
      - '.github/workflows/nova-au.yml'
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  intel-au:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Build real x86_64 AU component without signing identity
        run: tools/nova-au/build.sh "$RUNNER_TEMP/nova-au"
      - name: Portable DSP measurement and smoothing
        run: |
          xcrun clang++ -std=c++20 -O2 tools/nova-au/tests/dsp.cpp -o "$RUNNER_TEMP/nova-dsp"
          "$RUNNER_TEMP/nova-dsp"
      - name: Quality EQ, compressor, loudness and mastering audio
        run: |
          xcrun clang++ -std=c++20 -O2 tools/nova-au/tests/quality.cpp -o "$RUNNER_TEMP/nova-quality"
          "$RUNNER_TEMP/nova-quality" "$RUNNER_TEMP/nova-au/quality" | tee "$RUNNER_TEMP/nova-au/quality-measurements.txt"
      - name: Actual FFT, bounded capture and comparison engine
        run: |
          xcrun clang++ -std=c++20 -O2 -pthread tools/nova-au/tests/analysis.cpp -o "$RUNNER_TEMP/nova-analysis"
          "$RUNNER_TEMP/nova-analysis" | tee "$RUNNER_TEMP/nova-au/analysis-portable.txt"
          xcrun clang++ -std=c++20 -O2 tools/nova-au/tests/performance.cpp -o "$RUNNER_TEMP/nova-performance"
          "$RUNNER_TEMP/nova-performance" | tee "$RUNNER_TEMP/nova-au/render-performance.txt"
          xcrun clang++ -std=c++20 -O2 tools/nova-au/analyze.cpp -o "$RUNNER_TEMP/nova-analyze"
          python3 tools/nova-au/analyze-wav.py assets/music-acoustic-v1/piano-60.wav --engine "$RUNNER_TEMP/nova-analyze" --output "$RUNNER_TEMP/nova-au/piano-comparison" --project fixture --track piano --source development-fixture --instruction 全体の音を自然に整えて > "$RUNNER_TEMP/nova-au/piano-analysis.json"
          python3 tools/nova-au/analyze-wav.py assets/music-acoustic-v1/strings-60.wav --engine "$RUNNER_TEMP/nova-analyze" --output "$RUNNER_TEMP/nova-au/strings-comparison" --project fixture --track strings --source development-fixture --instruction 全体の音を自然に整えて > "$RUNNER_TEMP/nova-au/strings-analysis.json"
          python3 tools/nova-au/analyze-wav.py assets/music-acoustic-v1/bass-24.wav --engine "$RUNNER_TEMP/nova-analyze" --output "$RUNNER_TEMP/nova-au/bass-comparison" --project fixture --track bass --source development-fixture --instruction 全体の音を自然に整えて > "$RUNNER_TEMP/nova-au/bass-analysis.json"
          python3 tools/nova-au/tests/verify-wavs.py "$RUNNER_TEMP/nova-au/piano-comparison" "$RUNNER_TEMP/nova-au/strings-comparison" "$RUNNER_TEMP/nova-au/bass-comparison"
      - name: Load binary as AudioComponent and render actual audio
        run: |
          xcrun clang++ -std=c++20 -O2 -arch x86_64 -mmacosx-version-min=12.0 -fobjc-arc tools/nova-au/tests/host.mm -framework Foundation -framework AudioToolbox -o "$RUNNER_TEMP/nova-au-host"
          "$RUNNER_TEMP/nova-au-host" "$RUNNER_TEMP/nova-au/NovaMix.component/Contents/MacOS/NovaMix" "$RUNNER_TEMP/nova-au/actual" | tee "$RUNNER_TEMP/nova-au/host-measurements.txt"
          shasum -a 256 "$RUNNER_TEMP/nova-au/actual-approved.wav" > "$RUNNER_TEMP/nova-au/wav-sha256.txt"
      - name: Native AU view whole-song launch and approved live parameter integration
        run: |
          if ! command -v ffmpeg; then brew install ffmpeg; fi
          xcrun clang++ -std=c++20 -O2 -arch x86_64 -mmacosx-version-min=12.0 -fobjc-arc tools/nova-au/tests/whole-song-ui.mm -framework Cocoa -framework AudioToolbox -o "$RUNNER_TEMP/nova-whole-ui"
          "$RUNNER_TEMP/nova-whole-ui" "$RUNNER_TEMP/nova-au/NovaMix.component" "$(command -v python3)" "$(command -v ffmpeg)" "$RUNNER_TEMP/nova-au/whole-ui"
      - name: Public parameter control of an owned Apple AU fixture
        run: |
          xcrun clang++ -std=c++20 -fobjc-arc tools/nova-au/tests/apple-host-control.mm -framework Foundation -framework AudioToolbox -o "$RUNNER_TEMP/apple-au-host-control"
          "$RUNNER_TEMP/apple-au-host-control" --approved-ci-fixture | tee "$RUNNER_TEMP/nova-au/apple-owned-host-control.json"
      - name: AU validation on disposable CI machine only
        run: |
          sudo mkdir -p /Library/Audio/Plug-Ins/Components
          sudo cp -R "$RUNNER_TEMP/nova-au/NovaMix.component" /Library/Audio/Plug-Ins/Components/
          sudo touch /Library/Audio/Plug-Ins/Components/NovaMix.component
          codesign --verify --strict /Library/Audio/Plug-Ins/Components/NovaMix.component
          plutil -p /Library/Audio/Plug-Ins/Components/NovaMix.component/Contents/Info.plist
          # The earlier read-only/dynamic host may have started a registrar before the bundle existed.
          # Refresh only the disposable CI registrar, then require real filesystem discovery.
          killall AudioComponentRegistrar || true
          for attempt in {1..10}; do
            /usr/bin/auval -a > "$RUNNER_TEMP/nova-au/au-list.txt"
            if grep -q 'NvMx.*NvSt' "$RUNNER_TEMP/nova-au/au-list.txt"; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nova-au/au-list.txt"
          /usr/bin/log show --last 2m --predicate 'process == "AudioComponentRegistrar"' --style compact > "$RUNNER_TEMP/nova-au/registrar-log.txt" 2>&1 || true
          grep 'NvMx.*NvSt' "$RUNNER_TEMP/nova-au/au-list.txt"
          /usr/bin/auval -v aufx NvMx NvSt | tee "$RUNNER_TEMP/nova-au/auval.txt"
      - name: Existing Swift wrapper regression tests
        run: swift test --package-path tools/music-native-wrapper
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Node, syntax and whitespace
        run: |
          xcrun clang++ -std=c++20 -O2 tools/nova-au/tests/meter.cpp -o "$RUNNER_TEMP/nova-meter"
          node tools/nova-au/tests/loudness-reference.js "$RUNNER_TEMP/nova-meter" | tee "$RUNNER_TEMP/nova-au/loudness-reference.jsonl"
          node --test > "$RUNNER_TEMP/nova-au/node-tests.txt"
          git ls-files '*.js' | xargs -n1 node --check
          git diff --check HEAD^ HEAD
      - name: Existing handoff browser regression, four viewports
        env:
          NODE_PATH: ${{ runner.temp }}/nova-browser/node_modules
          CHROME_EXECUTABLE: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/nova-browser" playwright
          node scripts/music-logic-instruments-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-au-intel-development
          path: |
            ${{ runner.temp }}/nova-au
            verification/music-logic-instruments-*

  whole-song:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Independent reference and bounded whole-song processing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          g++ -std=c++20 -O2 tools/nova-au/whole-song.cpp -o "$RUNNER_TEMP/nova-whole-song"
          python3 tools/nova-au/tests/whole-song-proposals.py --engine "$RUNNER_TEMP/nova-whole-song"
          python3 tools/nova-au/tests/au-whole-song.py --engine "$RUNNER_TEMP/nova-whole-song" --output "$RUNNER_TEMP/whole-bridge"
          python3 tools/nova-au/tests/whole-song-safety.py --engine "$RUNNER_TEMP/nova-whole-song"
          /usr/bin/time -v python3 tools/nova-au/tests/whole-song.py --engine "$RUNNER_TEMP/nova-whole-song" --output "$RUNNER_TEMP/whole-song" --long > "$RUNNER_TEMP/whole-song-log.txt" 2> "$RUNNER_TEMP/whole-song-resources.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-whole-song-audio
          path: |
            ${{ runner.temp }}/whole-song/**/manifest.json
            ${{ runner.temp }}/whole-song/**/*.wav
            ${{ runner.temp }}/whole-song/**/*.f32
            ${{ runner.temp }}/whole-song/whole-song-results.json
            ${{ runner.temp }}/whole-song/peak-guard-results.json
            ${{ runner.temp }}/whole-song-log.txt
            ${{ runner.temp }}/whole-song-resources.txt
