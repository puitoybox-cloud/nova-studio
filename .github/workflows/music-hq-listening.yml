name: NOVA acoustic AI listening samples
on:
  pull_request:
    paths:
      - 'scripts/music-listening-*.js'
      - 'music-studio-acoustic.js'
      - 'assets/music-acoustic-v1/**'
      - '.github/workflows/music-hq-listening.yml'
      - '.github/workflows/music-listening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listening:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/music-local-generation/requirements.txt
      - run: python tools/music-local-generation/prepare.py "$RUNNER_TEMP/nova-generation-assets"
      - name: Actual ONNX 40-second A/B/C and melody preservation
        env:
          NOVA_MODEL_WEIGHTS: ${{ runner.temp }}/nova-generation-assets/weights
          NOVA_TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NOVA_SAMPLE_FIXTURE: ${{ runner.temp }}/listening-fixture.json
        run: node scripts/music-listening-generation.js
      - name: Production WAV rendering, independent stems and mastered mix
        env:
          NOVA_TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NOVA_SAMPLE_FIXTURE: ${{ runner.temp }}/listening-fixture.json
          CHROME_EXECUTABLE: /usr/bin/google-chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/listening-browser" playwright
          NODE_PATH="$RUNNER_TEMP/listening-browser/node_modules" node scripts/music-listening-browser.js
      - name: Same MIDI with acoustic samples
        env:
          NOVA_TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NOVA_SAMPLE_FIXTURE: ${{ runner.temp }}/listening-fixture.json
          NOVA_SAMPLE_OUTPUT: verification/listening-hq
          NOVA_HQ: '1'
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          NODE_PATH: ${{ runner.temp }}/listening-browser/node_modules
        run: node scripts/music-listening-browser.js
      - name: M4A and license notices
        run: |
          mkdir -p verification/listening-hq/licenses
          cp assets/music-acoustic-v1/*.md assets/music-acoustic-v1/*.txt assets/music-acoustic-v1/Manifest.json verification/listening-hq/licenses/
          for f in verification/listening/*.wav verification/listening-hq/*.wav; do ffmpeg -v error -y -i "$f" -c:a aac -b:a 192k "${f%.wav}.m4a"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-Acoustic-AI-listening-comparison
          retention-days: 90
          if-no-files-found: error
          path: |
            verification/listening/
            verification/listening-hq/
            verification/music-listening-generation.json
  software-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test
      - run: node --check scripts/music-listening-generation.js && node --check scripts/music-listening-browser.js
      - run: git diff --check
      - run: python -m unittest discover -s tools/music-audio-pipeline
      - run: python tools/music-local-generation/test_constraints.py

  acoustic-eight-minute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/stem-browser" playwright
      - name: Acoustic eight minute stem save, reopen, mix, master, restore and export
        env:
          NODE_PATH: ${{ runner.temp }}/stem-browser/node_modules
          CHROME_EXECUTABLE: /usr/bin/google-chrome
          NOVA_TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NOVA_HQ: '1'
        run: /usr/bin/time -v node scripts/music-eight-minute-stems-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acoustic-eight-minute-results
          path: verification/music-eight-minute-stems-browser.json
