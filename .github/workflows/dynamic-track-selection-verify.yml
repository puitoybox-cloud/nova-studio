name: Dynamic Track Selection Verify

on:
  push:
    branches:
      - agent/music-studio-dynamic-track-selection-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node test suite
        run: node --test
      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          echo "Checked JavaScript files: $count"
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Headless responsive browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nova-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          node <<'NODE' 2>&1 | tee browser-smoke.log
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const width of [1440,820,390]){
                const page=await browser.newPage({viewport:{width,height:900}}),messages=[];
                page.on('console',message=>{
                  if(!['error','warning'].includes(message.type()))return;
                  const text=message.text();
                  if(/favicon/i.test(text)&&/404|failed to load/i.test(text))return;
                  messages.push(`${message.type()}: ${text}`)
                });
                await page.goto('http://127.0.0.1:8765/music-studio.html#music-studio',{waitUntil:'load'});
                const metrics=await page.evaluate(()=>{
                  const midiData={tracks:[
                    {id:'m',part:'melody',name:'Melody',channel:1,program:0,muted:false,notes:[{id:'mn',pitch:60,startTick:0,durationTicks:480,velocity:90}]},
                    {id:'d',part:'drums',name:'Drums',channel:10,program:null,muted:false,notes:[{id:'dn',pitch:36,startTick:0,durationTicks:120,velocity:100}]},
                    {id:'b',part:'bass',name:'Bass',channel:2,program:32,muted:false,notes:[{id:'bn',pitch:40,startTick:0,durationTicks:480,velocity:80}]},
                    {id:'ext-a',name:'Strings',trackType:'midi-melodic',roleAssignment:'unassigned',channel:3,program:48,order:4,notes:[{id:'en',pitch:72,startTick:0,durationTicks:480,velocity:70}]},
                    {id:'ext-b',name:'Strings',trackType:'midi-melodic',roleAssignment:'unassigned',channel:4,program:49,order:5,notes:[{id:'en2',pitch:74,startTick:480,durationTicks:480,velocity:71}]}
                  ]};
                  const project=MusicStudio.makeProject({projectId:'browser-dynamic',projectName:'Dynamic Browser',songTitle:'Dynamic Browser'});
                  project.midiData=midiData;
                  MusicStudio.state.projects=[project];
                  MusicStudio.state.midiEditor=MusicStudioEditor.createSession(project);
                  history.replaceState(null,'','#music-studio/midi-editor/browser-dynamic');
                  const host=document.querySelector('#music-studio-app');
                  host.innerHTML=MusicStudio.renderRoute('music-studio/midi-editor/browser-dynamic');
                  const beforeTop=document.querySelector('.music-editor-layout').getBoundingClientRect().top;
                  MusicStudio.enhanceDynamicTrackSelection();
                  let strip=document.querySelector('.music-dynamic-track-strip');
                  let groups=[...strip.querySelectorAll('.music-dynamic-track-group')];
                  const afterTop=document.querySelector('.music-editor-layout').getBoundingClientRect().top;
                  const groupCenter=group=>{const rect=group.getBoundingClientRect();return rect.top+rect.height/2};
                  const initialSameRow=groups.length>0&&groups.every(group=>Math.abs(groupCenter(group)-groupCenter(groups[0]))<2);
                  const review=Boolean(document.querySelector('.music-external-track-review-entry'));
                  const target=document.querySelector('[data-track-id="ext-b"] .music-dynamic-track-button');
                  target?.click();
                  MusicStudio.enhanceDynamicTrackSelection();
                  strip=document.querySelector('.music-dynamic-track-strip');
                  groups=[...strip.querySelectorAll('.music-dynamic-track-group')];
                  const current=MusicStudio.resolveCurrentTrackSelection();
                  const record=document.querySelector('[onclick*="editorToggleMidiRecording"]');
                  const play=document.querySelector('[onclick*="editorToggleMelodyPlayback"]');
                  const currentTrack=MusicStudio.state.midiEditor.midiData.tracks.find(track=>track.id==='ext-b');
                  const partialGuard=MusicStudio.editorStartPartialEdit();
                  const correctionGuard=MusicStudio.editorPreviewCorrection();
                  const recordGuard=MusicStudio.editorToggleMidiRecording();
                  const playGuard=MusicStudio.editorToggleMelodyPlayback();
                  return{
                    beforeTop,afterTop,count:groups.length,targetFound:Boolean(target),review,
                    currentId:current?.id,selectedTrackId:MusicStudio.state.midiEditor.selectedTrackId,
                    activeId:document.querySelector('.music-dynamic-track-button.is-active')?.closest('[data-track-id]')?.dataset.trackId||'',
                    recordDisabled:record?.disabled===true,playDisabled:play?.disabled===true,
                    partialGuard:partialGuard?.reason,correctionGuard:correctionGuard?.reason,recordGuard:recordGuard?.reason,playGuard:playGuard?.reason,
                    role:currentTrack?.roleAssignment,
                    noteIds:MusicStudio.state.midiEditor.midiData.tracks.flatMap(track=>track.notes||[]).map(note=>note.id),
                    allSameRow:initialSameRow&&groups.length>0&&groups.every(group=>Math.abs(groupCenter(group)-groupCenter(groups[0]))<2),
                    stripScrollHeight:strip?.scrollHeight??0,stripClientHeight:strip?.clientHeight??0,
                    bodyOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
                  }
                });
                console.log(`browser @${width}: ${JSON.stringify(metrics)}`);
                assert.equal(metrics.count,5,`Track count @${width}`);
                assert.equal(metrics.targetFound,true,`External target @${width}`);
                assert.equal(metrics.review,true,`Review entry @${width}`);
                assert.equal(metrics.currentId,'ext-b',`Current Track @${width}`);
                assert.equal(metrics.selectedTrackId,'ext-b',`selectedTrackId @${width}`);
                assert.equal(metrics.activeId,'ext-b',`active UI @${width}`);
                assert.equal(metrics.recordDisabled,true,`Record disabled @${width}`);
                assert.equal(metrics.playDisabled,true,`Playback disabled @${width}`);
                for(const reason of [metrics.partialGuard,metrics.correctionGuard,metrics.recordGuard,metrics.playGuard])assert.equal(reason,'core-track-required',`External feature gate @${width}`);
                assert.equal(metrics.role,'unassigned',`roleAssignment preserved @${width}`);
                assert.deepEqual(metrics.noteIds,['mn','dn','bn','en','en2'],`notes preserved @${width}`);
                assert.equal(metrics.allSameRow,true,`single Track row @${width}`);
                assert.ok(metrics.afterTop<=metrics.beforeTop+2,`Piano Roll pushed down @${width}: ${metrics.beforeTop} -> ${metrics.afterTop}`);
                assert.ok(metrics.stripScrollHeight<=metrics.stripClientHeight+2,`Track strip wrapped vertically @${width}`);
                assert.ok(metrics.bodyOverflow<=1,`page horizontal overflow @${width}: ${metrics.bodyOverflow}`);
                assert.deepEqual(messages,[],`console warnings/errors @${width}`);
                await page.close()
              }
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Upload browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-track-selection-browser-smoke
          path: browser-smoke.log
          if-no-files-found: warn
          retention-days: 1
