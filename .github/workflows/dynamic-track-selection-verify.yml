name: Dynamic Track Selection Verify

on:
  push:
    branches:
      - agent/music-studio-dynamic-track-selection-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node test suite
        run: node --test
      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          echo "Checked JavaScript files: $count"
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Headless responsive browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nova-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const width of [1440,820,390]){
                const page=await browser.newPage({viewport:{width,height:900}}),messages=[];
                page.on('console',message=>{if(['error','warning'].includes(message.type()))messages.push(`${message.type()}: ${message.text()}`)});
                await page.goto('http://127.0.0.1:8765/music-studio.html#music-studio',{waitUntil:'load'});
                const metrics=await page.evaluate(()=>{
                  const midiData={tracks:[
                    {id:'m',part:'melody',name:'Melody',channel:1,program:0,muted:false,notes:[{id:'mn',pitch:60,startTick:0,durationTicks:480,velocity:90}]},
                    {id:'d',part:'drums',name:'Drums',channel:10,program:null,muted:false,notes:[{id:'dn',pitch:36,startTick:0,durationTicks:120,velocity:100}]},
                    {id:'b',part:'bass',name:'Bass',channel:2,program:32,muted:false,notes:[{id:'bn',pitch:40,startTick:0,durationTicks:480,velocity:80}]},
                    {id:'ext-a',name:'Strings',trackType:'midi-melodic',roleAssignment:'unassigned',channel:3,program:48,order:4,notes:[{id:'en',pitch:72,startTick:0,durationTicks:480,velocity:70}]},
                    {id:'ext-b',name:'Strings',trackType:'midi-melodic',roleAssignment:'unassigned',channel:4,program:49,order:5,notes:[{id:'en2',pitch:74,startTick:480,durationTicks:480,velocity:71}]}
                  ]};
                  const project=MusicStudio.makeProject({projectId:'browser-dynamic',projectName:'Dynamic Browser',songTitle:'Dynamic Browser',midiData});
                  MusicStudio.state.projects=[project];MusicStudio.state.midiEditor=MusicStudioEditor.createSession(project);
                  const host=document.querySelector('#music-studio-app');host.innerHTML=MusicStudio.midiEditorView(project.projectId);
                  const beforeTop=document.querySelector('.music-editor-layout').getBoundingClientRect().top;
                  MusicStudio.enhanceDynamicTrackSelection();
                  const strip=document.querySelector('.music-dynamic-track-strip'),children=[...strip.querySelectorAll('.music-dynamic-track-group')],afterTop=document.querySelector('.music-editor-layout').getBoundingClientRect().top;
                  const allSameRow=children.every(child=>Math.abs(child.getBoundingClientRect().top-children[0].getBoundingClientRect().top)<2);
                  const review=Boolean(document.querySelector('.music-external-track-review-entry'));
                  document.querySelector('[data-track-id="ext-b"] .music-dynamic-track-button').click();
                  const current=MusicStudio.resolveCurrentTrackSelection(),record=document.querySelector('[onclick*="editorToggleMidiRecording"]'),play=document.querySelector('[onclick*="editorToggleMelodyPlayback"]'),partial=document.querySelector('.music-partial-edit button');
                  return{beforeTop,afterTop,stripHeight:strip.getBoundingClientRect().height,allSameRow,review,count:children.length,currentId:current?.id,selectedTrackId:MusicStudio.state.midiEditor.selectedTrackId,recordDisabled:record?.disabled===true,playDisabled:play?.disabled===true,partialDisabled:partial?.disabled===true,role:MusicStudio.state.midiEditor.midiData.tracks.find(t=>t.id==='ext-b').roleAssignment,noteIds:MusicStudio.state.midiEditor.midiData.tracks.flatMap(t=>t.notes||[]).map(n=>n.id),bodyOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
                });
                assert.equal(metrics.count,5,`Track count @${width}`);assert.equal(metrics.allSameRow,true,`single row @${width}`);assert.equal(metrics.review,true,`Review entry @${width}`);assert.equal(metrics.currentId,'ext-b');assert.equal(metrics.selectedTrackId,'ext-b');assert.equal(metrics.recordDisabled,true);assert.equal(metrics.playDisabled,true);assert.equal(metrics.partialDisabled,true);assert.equal(metrics.role,'unassigned');assert.deepEqual(metrics.noteIds,['mn','dn','bn','en','en2']);assert.ok(Math.abs(metrics.afterTop-metrics.beforeTop)<=2,`Piano Roll top changed @${width}: ${metrics.beforeTop} -> ${metrics.afterTop}`);assert.ok(metrics.bodyOverflow<=1,`body horizontal overflow @${width}: ${metrics.bodyOverflow}`);assert.ok(metrics.stripHeight<=44,`strip too tall @${width}: ${metrics.stripHeight}`);assert.deepEqual(messages,[],`console warnings/errors @${width}`);
                console.log(JSON.stringify({width,...metrics}));await page.close()
              }
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE