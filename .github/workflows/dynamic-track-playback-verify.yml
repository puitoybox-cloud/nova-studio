name: Dynamic Track Playback Verify

on:
  push:
    branches:
      - agent/music-studio-dynamic-track-playback-routing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node tests
        run: node --test
      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count+1))
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)
          echo "Checked JavaScript files: $count"
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Headless responsive browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nova-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          node <<'NODE' 2>&1 | tee browser-smoke.log
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const width of [1440,820,390]){
                const page=await browser.newPage({viewport:{width,height:900}}),messages=[];
                page.on('console',message=>{
                  if(!['error','warning'].includes(message.type()))return;
                  const text=message.text();
                  if(/favicon/i.test(text)&&/404|failed to load/i.test(text))return;
                  messages.push(`${message.type()}: ${text}`)
                });
                await page.goto('http://127.0.0.1:8765/music-studio.html#music-studio',{waitUntil:'load'});
                const metrics=await page.evaluate(async()=>{
                  const midiData={ppq:480,tempo:120,timeSignature:{numerator:4,denominator:4},editor:{measureCount:4,transport:{countInEnabled:true,metronomeEnabled:true}},tracks:[
                    {id:'m',part:'melody',name:'Melody',channel:1,program:0,muted:false,notes:[{id:'mn',pitch:60,startTick:0,durationTicks:480,velocity:90}]},
                    {id:'d',part:'drums',name:'Drums',channel:10,program:null,muted:false,notes:[{id:'dn',pitch:36,startTick:0,durationTicks:120,velocity:100}]},
                    {id:'b',part:'bass',name:'Bass',channel:2,program:32,muted:false,notes:[{id:'bn',pitch:40,startTick:0,durationTicks:480,velocity:80}]},
                    {id:'ext-a',name:'Strings',trackType:'midi-melodic',roleAssignment:'unassigned',channel:3,program:48,order:4,notes:[{id:'en',pitch:72,startTick:0,durationTicks:480,velocity:70}]},
                    {id:'ext-b',name:'Strings',trackType:'midi-melodic',roleAssignment:'unassigned',channel:4,program:49,order:5,notes:[{id:'en2',pitch:74,startTick:480,durationTicks:480,velocity:71}]}
                  ]};
                  const project=MusicStudio.makeProject({projectId:'browser-playback',projectName:'Dynamic Playback',songTitle:'Dynamic Playback'});
                  project.midiData=midiData;
                  MusicStudio.state.projects=[project];
                  MusicStudio.state.midiEditor=MusicStudioEditor.createSession(project);
                  history.replaceState(null,'','#music-studio/midi-editor/browser-playback');
                  const host=document.querySelector('#music-studio-app');
                  host.innerHTML=MusicStudio.renderRoute('music-studio/midi-editor/browser-playback');
                  MusicStudio.enhanceDynamicTrackSelection();
                  const beforeTop=document.querySelector('.music-editor-layout').getBoundingClientRect().top;
                  document.querySelector('[data-track-id="ext-b"] .music-dynamic-track-button')?.click();
                  MusicStudio.enhanceDynamicTrackSelection();
                  MusicStudioDynamicTrackPlayback.enhancePlaybackUi();
                  let scheduled=[];
                  MusicStudio.state.melodyAudio.synth={
                    context:{currentTime:0},supported:()=>true,unlock:async()=>true,stopPlayback:()=>{},
                    playTracks:(tracks,timing)=>{scheduled=tracks.map(track=>({id:track.id,part:track.part,noteIds:(track.notes||[]).map(note=>note.id)}));return{ok:true,trackCount:tracks.length,noteCount:tracks.flatMap(track=>track.notes||[]).length,durationMs:60000,playbackStart:0,secondsPerTick:.001,timelineDurationSeconds:60,tempoMap:timing.tempoMap||[],startTick:Number(timing.startTick)||0,endTick:Number(timing.endTick)||1920}}
                  };
                  const currentBefore=MusicStudio.resolveCurrentTrackSelection();
                  const playButton=document.querySelector('[onclick*="editorToggleMelodyPlayback"]');
                  const recordButton=document.querySelector('[onclick*="editorToggleMidiRecording"]');
                  const playInitiallyDisabled=playButton?.disabled===true;
                  const recordDisabled=recordButton?.disabled===true;
                  const partialGuard=MusicStudio.editorStartPartialEdit();
                  const correctionGuard=MusicStudio.editorPreviewCorrection();
                  const recordGuard=MusicStudio.editorToggleMidiRecording();
                  const result=await MusicStudio.editorToggleMelodyPlayback();
                  MusicStudioDynamicTrackPlayback.enhancePlaybackUi();
                  const playing=MusicStudio.state.melodyAudio.playing===true;
                  const activeIds=[...(MusicStudio.state.melodyAudio.transport?.activePlaybackTrackIds||[])];
                  const stopButton=document.querySelector('[onclick*="editorStopTransport"]');
                  const stopEnabled=stopButton?.disabled===false;
                  const stopResult=await MusicStudio.editorToggleMelodyPlayback();
                  MusicStudioDynamicTrackPlayback.enhancePlaybackUi();
                  const playingAfterStop=MusicStudio.state.melodyAudio.playing===true;
                  const currentTrack=MusicStudio.state.midiEditor.midiData.tracks.find(track=>track.id==='ext-b');
                  const strip=document.querySelector('.music-dynamic-track-strip'),groups=[...strip.querySelectorAll('.music-dynamic-track-group')];
                  const center=group=>{const rect=group.getBoundingClientRect();return rect.top+rect.height/2};
                  const afterTop=document.querySelector('.music-editor-layout').getBoundingClientRect().top;
                  return{
                    currentId:currentBefore?.id,selectedTrackId:MusicStudio.state.midiEditor.selectedTrackId,
                    scheduled,playInitiallyDisabled,recordDisabled,partialGuard:partialGuard?.reason,correctionGuard:correctionGuard?.reason,recordGuard:recordGuard?.reason,
                    playOk:result?.ok,playing,activeIds,stopEnabled,stopOk:stopResult?.ok,playingAfterStop,
                    role:currentTrack?.roleAssignment,noteIds:MusicStudio.state.midiEditor.midiData.tracks.flatMap(track=>track.notes||[]).map(note=>note.id),
                    allSameRow:groups.length>0&&groups.every(group=>Math.abs(center(group)-center(groups[0]))<2),
                    beforeTop,afterTop,stripScrollHeight:strip?.scrollHeight??0,stripClientHeight:strip?.clientHeight??0,
                    bodyOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
                  }
                });
                console.log(`browser @${width}: ${JSON.stringify(metrics)}`);
                assert.equal(metrics.currentId,'ext-b',`Current Track @${width}`);
                assert.equal(metrics.selectedTrackId,'ext-b',`selectedTrackId @${width}`);
                assert.equal(metrics.playInitiallyDisabled,false,`External Play enabled @${width}`);
                assert.equal(metrics.recordDisabled,true,`External Record remains gated @${width}`);
                for(const reason of [metrics.partialGuard,metrics.correctionGuard,metrics.recordGuard])assert.equal(reason,'core-track-required',`External edit gate @${width}`);
                assert.equal(metrics.playOk,true,`External playback result @${width}`);
                assert.equal(metrics.playing,true,`External playing state @${width}`);
                assert.deepEqual(metrics.activeIds,['ext-b'],`active Track ID @${width}`);
                assert.deepEqual(metrics.scheduled,[{id:'ext-b',part:'melody',noteIds:['en2']}],`scheduled exact external Track @${width}`);
                assert.equal(metrics.stopEnabled,true,`Stop enabled @${width}`);
                assert.equal(metrics.stopOk,true,`Stop result @${width}`);
                assert.equal(metrics.playingAfterStop,false,`Stopped state @${width}`);
                assert.equal(metrics.role,'unassigned',`roleAssignment preserved @${width}`);
                assert.deepEqual(metrics.noteIds,['mn','dn','bn','en','en2'],`notes preserved @${width}`);
                assert.equal(metrics.allSameRow,true,`single Track row @${width}`);
                assert.ok(metrics.afterTop<=metrics.beforeTop+2,`Piano Roll pushed down @${width}: ${metrics.beforeTop} -> ${metrics.afterTop}`);
                assert.ok(metrics.stripScrollHeight<=metrics.stripClientHeight+2,`Track strip wrapped vertically @${width}`);
                assert.ok(metrics.bodyOverflow<=1,`page horizontal overflow @${width}: ${metrics.bodyOverflow}`);
                assert.deepEqual(messages,[],`console warnings/errors @${width}`);
                await page.close()
              }
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Upload browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-track-playback-browser-smoke
          path: browser-smoke.log
          if-no-files-found: warn
          retention-days: 1
