name: Music Studio cache version consistency
on:
  push:
    branches:
      - agent/music-studio-cache-version-consistency
      - verification/music-studio-baseline-combined
  pull_request:
    paths:
      - 'index.html'
      - 'tests/music-studio-external-song-import.test.js'
      - 'tests/music-studio-home.test.js'
      - 'tests/music-studio-ipad-touch.test.js'
      - '.github/workflows/music-studio-cache-version-consistency.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Cache and entry regression tests
        run: node --test tests/music-studio-external-song-import.test.js tests/music-studio-home.test.js tests/music-studio-ipad-touch.test.js
      - name: Repository Node regression suite (required combined Draft check)
        run: node --test
      - name: Repository JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Whitespace integrity
        run: git diff --check HEAD^ HEAD
