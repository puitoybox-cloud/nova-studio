name: Music Studio read-only dependencies
on:
  pull_request:
    paths:
      - 'music-studio.js'
      - 'music-studio-binary-boundary.js'
      - 'tests/music-studio-binary-boundary.test.js'
      - 'scripts/music-binary-boundary-browser.js'
      - 'scripts/music-transaction-regression.js'
      - 'music-studio-production-verification-contract.js'
      - 'tests/music-studio-production-verification-contract.test.js'
      - 'music-studio-dependency-inspection.js'
      - 'music-studio-storage-contract-inspection.js'
      - 'music-studio-dependency-closure-inspection.js'
      - 'music-studio-package-restore-review.js'
      - 'music-studio-observed-byte-verification.js'
      - 'scripts/music-studio-disposable-durable-backend.js'
      - 'tests/music-studio-disposable-durable-recovery.test.js'
      - 'tests/music-studio-observed-byte-verification.test.js'
      - 'tests/music-studio-package-restore-review.test.js'
      - 'tests/music-studio-dependency-closure-inspection.test.js'
      - 'tests/music-studio-storage-contract-inspection.test.js'
      - 'scripts/music-studio-standalone-dependency-inspection.js'
      - 'tests/music-studio*dependency-inspection.test.js'
      - 'tools/music-audio-pipeline/verify_real_conversion.py'
      - 'music-studio-midi-parser.js'
      - '.github/workflows/music-studio-dependency-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full regression, syntax and whitespace
        run: |
          node --test
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          python3 -m py_compile tools/music-audio-pipeline/verify_real_conversion.py
          git diff --check "origin/${{ github.base_ref || 'main' }}...HEAD"
      - name: Real Chrome at 1440 / 820 / 390
        timeout-minutes: 12
        run: |
          npm install --prefix "$RUNNER_TEMP/nova-browser" playwright
          google-chrome --version
          NODE_PATH="$RUNNER_TEMP/nova-browser/node_modules" CHROME_EXECUTABLE=/usr/bin/google-chrome timeout --kill-after=5s 100s node scripts/music-binary-boundary-browser.js
          git show 031def44c194787f4e8e17552961d62e93b10df2:scripts/music-transaction-regression.js > "$RUNNER_TEMP/original-298.js"
          set +e
          timeout --kill-after=5s 40s env NODE_PATH="$RUNNER_TEMP/nova-browser/node_modules" CHROME_EXECUTABLE=/usr/bin/google-chrome node "$RUNNER_TEMP/original-298.js" > verification/music-298-original-diagnostic.log 2>&1
          diagnostic_status=$?
          set -e
          echo "Original #298 diagnostic exit: $diagnostic_status" | tee -a verification/music-298-original-diagnostic.log
          cat verification/music-298-original-diagnostic.log
          NODE_PATH="$RUNNER_TEMP/nova-browser/node_modules" CHROME_EXECUTABLE=/usr/bin/google-chrome timeout --kill-after=5s 100s node scripts/music-transaction-regression.js
          NODE_PATH="$RUNNER_TEMP/nova-browser/node_modules" CHROME_EXECUTABLE=/usr/bin/google-chrome timeout --kill-after=5s 600s node scripts/music-studio-ai-assistant-browser-smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-completion-browser-verification
          path: |
            verification/music-binary-browser-report.json
            verification/music-binary-*.png
            verification/music-transaction-browser-report.json
            verification/music-298-original-diagnostic.log
            music-ai-*.png
            verification/music-ai-assistant-browser-report-20261002.json
