name: PR 229 Final Exact-Head Chromium Verification

on:
  push:
    branches:
      - verify/pr229-exact-eaf5-chromium

permissions:
  contents: read

jobs:
  verify-final-head:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/music-studio-dynamic-track-recording-routing
          fetch-depth: 0

      - name: Confirm exact final PR head
        shell: bash
        run: |
          set -euo pipefail
          expected="e6a1e6100a433bf11599d4c99863d87d333c3791"
          actual="$(git rev-parse HEAD)"
          echo "Expected PR head: $expected"
          echo "Actual PR head:   $actual"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run final repository verification
        shell: bash
        run: |
          set -euo pipefail
          node --test
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count+1))
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          echo "node --check files: $count"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Install Playwright without modifying manifests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Start exact-final-tree localhost server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pr229-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/music-studio.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pr229-http.log
          exit 1

      - name: Run final Chromium responsive browser smoke
        id: browser_smoke
        continue-on-error: true
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8765
        shell: bash
        run: |
          set -o pipefail
          node scripts/music-studio-dynamic-track-recording-browser-smoke.js 2>&1 | tee /tmp/pr229-final-browser-smoke.log

      - name: Upload final browser smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr229-final-browser-smoke-log
          path: /tmp/pr229-final-browser-smoke.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail if browser smoke failed
        if: steps.browser_smoke.outcome == 'failure'
        shell: bash
        run: |
          cat /tmp/pr229-final-browser-smoke.log
          exit 1
