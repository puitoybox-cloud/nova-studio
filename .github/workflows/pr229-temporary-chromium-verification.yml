name: PR 229 Temporary Chromium Verification

on:
  push:
    branches:
      - verify/pr229-exact-eaf5-chromium

permissions:
  contents: write

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/music-studio-dynamic-track-recording-routing
          fetch-depth: 0

      - name: Confirm exact PR head before patch
        shell: bash
        run: |
          set -euo pipefail
          expected="eaf5d4f18b30101962cf1c32b8c3153e2de2b8b4"
          actual="$(git rev-parse HEAD)"
          echo "Expected PR head: $expected"
          echo "Actual PR head:   $actual"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Apply minimal External Delete shortcut fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('music-studio-dynamic-track-selection.js')
          text = path.read_text()
          old = "    const shortcut=api.editorHandleShortcut;if(typeof shortcut==='function')api.editorHandleShortcut=function(event,...args){if(isExternalSelection(api,core)&&!externalDeleteShortcut(event))return false;return shortcut.call(this,event,...args)};"
          new = "    const shortcut=api.editorHandleShortcut;if(typeof shortcut==='function')api.editorHandleShortcut=function(event,...args){if(!isExternalSelection(api,core))return shortcut.call(this,event,...args);if(!externalDeleteShortcut(event))return false;const key=String(event?.key||''),meta=Boolean(event?.metaKey||event?.ctrlKey),option=Boolean(event?.altKey),shift=Boolean(event?.shiftKey);if(!meta&&!option&&!shift&&(key==='Delete'||key==='Backspace')){if(!(core?.selectedIds?.(api.state?.midiEditor)||[]).length)return false;event?.preventDefault?.();api.editorDeleteNote?.();return true}return shortcut.call(this,event,...args)};"
          if text.count(old) != 1:
              raise SystemExit(f'expected shortcut wrapper exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new))

          old_asset = 'music-studio-dynamic-track-selection.js?v=1.0.4'
          new_asset = 'music-studio-dynamic-track-selection.js?v=1.0.5'
          for name in ('music-studio.html', 'index.html'):
              p = Path(name)
              s = p.read_text()
              if s.count(old_asset) != 1:
                  raise SystemExit(f'{name}: expected selection asset version exactly once, found {s.count(old_asset)}')
              p.write_text(s.replace(old_asset, new_asset))

          test_path = Path('tests/music-studio-dynamic-track-selection.test.js')
          tests = test_path.read_text()
          if "1\\.0\\.4" not in tests:
              raise SystemExit('expected escaped selection asset-version assertion')
          tests = tests.replace("1\\.0\\.4", "1\\.0\\.5")
          tests = tests.replace(old_asset, new_asset)
          marker = "test('External keyboard Delete is routed through the guarded API delete instead of the original lexical shortcut closure',()=>{const source=fs.readFileSync(path.join(__dirname,'..','music-studio-dynamic-track-selection.js'),'utf8');assert.match(source,/if\(!isExternalSelection\(api,core\)\)return shortcut\.call/);assert.match(source,/key==='Delete'\|\|key==='Backspace'/);assert.match(source,/api\.editorDeleteNote\?\.\(\)/)});\n"
          if marker not in tests:
              tests += "\n" + marker
          test_path.write_text(tests)

          playback_path = Path('tests/music-studio-dynamic-track-playback.test.js')
          playback = playback_path.read_text()
          old_test = "test('Space and the explicitly allowed Delete shortcut reach their External handlers without opening other gated shortcuts',()=>{const env=load('ext-a');let prevented=false;const handled=env.api.editorHandleShortcut({key:' ',preventDefault(){prevented=true}});assert.equal(handled,true);assert.equal(prevented,true);assert.equal(env.shortcutCalls,0);assert.equal(env.api.editorHandleShortcut({key:'Delete'}),'original-shortcut');assert.equal(env.shortcutCalls,1);assert.equal(env.api.editorHandleShortcut({key:'c',metaKey:true}),false);assert.equal(env.shortcutCalls,1)});"
          new_test = "test('Space remains routed while External Delete without a selected note and other gated shortcuts stay blocked',()=>{const env=load('ext-a');let prevented=false;const handled=env.api.editorHandleShortcut({key:' ',preventDefault(){prevented=true}});assert.equal(handled,true);assert.equal(prevented,true);assert.equal(env.shortcutCalls,0);assert.equal(env.api.editorHandleShortcut({key:'Delete'}),false);assert.equal(env.shortcutCalls,0);assert.equal(env.api.editorHandleShortcut({key:'c',metaKey:true}),false);assert.equal(env.shortcutCalls,0)});"
          if playback.count(old_test) != 1:
              raise SystemExit(f'expected playback shortcut test exactly once, found {playback.count(old_test)}')
          playback_path.write_text(playback.replace(old_test, new_test))
          PY
          git diff -- music-studio-dynamic-track-selection.js music-studio.html index.html tests/music-studio-dynamic-track-selection.test.js tests/music-studio-dynamic-track-playback.test.js
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run repository verification before push
        shell: bash
        run: |
          set -euo pipefail
          node --test
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count+1))
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          echo "node --check files: $count"
          git diff --check

      - name: Install Playwright without modifying manifests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Start patched-tree localhost server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pr229-http.log 2>&1 &
          echo $! > /tmp/pr229-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/music-studio.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pr229-http.log
          exit 1

      - name: Run Chromium responsive browser smoke before push
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8765
        run: node scripts/music-studio-dynamic-track-recording-browser-smoke.js

      - name: Confirm only intended product files changed
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          unexpected="$(git status --porcelain --untracked-files=no | awk '{print $2}' | grep -Ev '^(music-studio-dynamic-track-selection\.js|music-studio\.html|index\.html|tests/music-studio-dynamic-track-selection\.test\.js|tests/music-studio-dynamic-track-playback\.test\.js)$' || true)"
          test -z "$unexpected"

      - name: Commit and push fix to Draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music-studio-dynamic-track-selection.js music-studio.html index.html tests/music-studio-dynamic-track-selection.test.js tests/music-studio-dynamic-track-playback.test.js
          git commit -m "fix: guard external track delete shortcuts by track id"
          git push origin HEAD:agent/music-studio-dynamic-track-recording-routing
          echo "NEW_PR_HEAD=$(git rev-parse HEAD)"
