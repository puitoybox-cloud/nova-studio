name: Temporary security browser verification
on:
  push:
    branches:
      - verify/security-import-url-hardening-4
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node --test
      - run: |
          count=0
          while IFS= read -r file; do
            node --check "$file"
            count=$((count+1))
          done < <(find . -path './.git' -prune -o -type f -name '*.js' -print | sort)
          echo "Checked $count JavaScript files"
      - run: git diff --check
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nova-security-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 1
          done
          SMOKE_BASE_URL=http://127.0.0.1:8765 node scripts/security-browser-smoke.js
