name: Music Audio Helper macOS

on:
  push:
    branches:
      - main
      - agent/music-audio-helper-boundary-tests
      - verification/music-studio-all-drafts-255
    paths:
      - 'tools/music-audio-pipeline/**'
      - '.github/workflows/music-audio-helper-macos.yml'
  pull_request:
    paths:
      - 'tools/music-audio-pipeline/**'
      - '.github/workflows/music-audio-helper-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install audio accuracy test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/audio-test-venv"
          "$RUNNER_TEMP/audio-test-venv/bin/python" -m pip install 'numpy<2' 'librosa>=0.10,<1' 'soundfile>=0.12,<1' 'mido>=1.3,<2'

      - name: Test local HTTP boundary and audio accuracy
        run: "$RUNNER_TEMP/audio-test-venv/bin/python" -m unittest discover -s tools/music-audio-pipeline -p 'test_*.py' -v

      - name: Validate local helper command syntax
        run: bash -n tools/music-audio-pipeline/START_AUDIO_PIPELINE.command tools/music-audio-pipeline/STOP_AUDIO_PIPELINE.command tools/music-audio-pipeline/mac-app/NovaMusicAudioHelper

      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT="$RUNNER_TEMP/Nova Music Audio Helper.app"
          CONTENTS="$APP_ROOT/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"
          mkdir -p "$MACOS" "$RESOURCES/pipeline"
          cp tools/music-audio-pipeline/mac-app/Info.plist "$CONTENTS/Info.plist"
          cp tools/music-audio-pipeline/mac-app/NovaMusicAudioHelper "$MACOS/NovaMusicAudioHelper"
          chmod +x "$MACOS/NovaMusicAudioHelper"
          cp tools/music-audio-pipeline/server.py "$RESOURCES/pipeline/server.py"
          cp tools/music-audio-pipeline/requirements.txt "$RESOURCES/pipeline/requirements.txt"
          cp tools/music-audio-pipeline/STOP_AUDIO_PIPELINE.command "$RESOURCES/pipeline/STOP_AUDIO_PIPELINE.command"
          chmod +x "$RESOURCES/pipeline/STOP_AUDIO_PIPELINE.command"
          /usr/bin/plutil -lint "$CONTENTS/Info.plist"
          /usr/bin/codesign --force --deep --sign - "$APP_ROOT"
          /usr/bin/codesign --verify --deep --strict "$APP_ROOT"
          ditto -c -k --sequesterRsrc --keepParent "$APP_ROOT" "$RUNNER_TEMP/Nova-Music-Audio-Helper-macOS.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNNOTARIZED-DO-NOT-LAUNCH-Nova-Music-Audio-Helper-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/Nova-Music-Audio-Helper-macOS.zip
          if-no-files-found: error
          retention-days: 14

      - name: Package inspectable local source for real-device verification
        if: ${{ hashFiles('verification/pr262/LOCAL_AUDIO_HELPER_SOURCE.md') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/PR262-Local-Audio-Helper-Source"
          mkdir -p "$ROOT"
          cp tools/music-audio-pipeline/{START_AUDIO_PIPELINE.command,STOP_AUDIO_PIPELINE.command,server.py,requirements.txt} "$ROOT/"
          cp verification/pr262/LOCAL_AUDIO_HELPER_SOURCE.md "$ROOT/README.md"
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > "$ROOT/PRODUCT_HEAD.txt"
          chmod +x "$ROOT/"*.command
          ditto -c -k --sequesterRsrc --keepParent "$ROOT" "$RUNNER_TEMP/PR262-Local-Audio-Helper-Source.zip"

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('verification/pr262/LOCAL_AUDIO_HELPER_SOURCE.md') != '' }}
        with:
          name: PR262-Local-Audio-Helper-Source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/PR262-Local-Audio-Helper-Source.zip
          if-no-files-found: error
          retention-days: 14
