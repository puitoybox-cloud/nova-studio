name: Music Audio Helper macOS

on:
  push:
    branches:
      - main
      - agent/music-audio-helper-boundary-tests
      - verification/music-studio-all-drafts-255
    paths:
      - 'tools/music-audio-pipeline/**'
      - '.github/workflows/music-audio-helper-macos.yml'
  pull_request:
    paths:
      - 'tools/music-audio-pipeline/**'
      - '.github/workflows/music-audio-helper-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audio accuracy test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/audio-test-venv"
          "$RUNNER_TEMP/audio-test-venv/bin/python" -m pip install --only-binary=:all: 'numpy<2' 'soundfile>=0.12,<1' 'mido>=1.3,<2'

      - name: Test local HTTP boundary and audio accuracy
        run: |
          "$RUNNER_TEMP/audio-test-venv/bin/python" -m unittest discover -s tools/music-audio-pipeline -p 'test_*.py' -v

      - name: Validate local helper command syntax
        run: bash -n tools/music-audio-pipeline/START_AUDIO_PIPELINE.command tools/music-audio-pipeline/STOP_AUDIO_PIPELINE.command tools/music-audio-pipeline/mac-app/NovaMusicAudioHelper

      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_ROOT="$RUNNER_TEMP/Nova Music Audio Helper.app"
          CONTENTS="$APP_ROOT/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"
          mkdir -p "$MACOS" "$RESOURCES/pipeline"
          cp tools/music-audio-pipeline/mac-app/Info.plist "$CONTENTS/Info.plist"
          cp tools/music-audio-pipeline/mac-app/NovaMusicAudioHelper "$MACOS/NovaMusicAudioHelper"
          chmod +x "$MACOS/NovaMusicAudioHelper"
          cp tools/music-audio-pipeline/server.py "$RESOURCES/pipeline/server.py"
          cp tools/music-audio-pipeline/{artifact_verification,runtime_evidence,local_distribution_entry,demucs_child,demucs_parent,demucs_receipt,scoped_closure,inventory_aggregation}.py "$RESOURCES/pipeline/"
          cp tools/music-audio-pipeline/runtime_inventory.py "$RESOURCES/pipeline/runtime_inventory.py"
          cp tools/music-audio-pipeline/distribution_binding.py "$RESOURCES/pipeline/distribution_binding.py"
          cp tools/music-audio-pipeline/dependency_identity.py "$RESOURCES/pipeline/dependency_identity.py"
          cp tools/music-audio-pipeline/helper_identity.py "$RESOURCES/pipeline/helper_identity.py"
          cp tools/music-audio-pipeline/requirements.txt "$RESOURCES/pipeline/requirements.txt"
          cp tools/music-audio-pipeline/STOP_AUDIO_PIPELINE.command "$RESOURCES/pipeline/STOP_AUDIO_PIPELINE.command"
          chmod +x "$RESOURCES/pipeline/STOP_AUDIO_PIPELINE.command"
          # Inspect actual packaged bytes before signing; source hashes are not approval anchors.
          python3 - "$APP_ROOT" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          source = Path('tools/music-audio-pipeline').resolve()
          sys.path.insert(0, str(source))
          from local_distribution_entry import SOURCES
          bundle = Path(sys.argv[1]) / 'Contents'
          entries = []
          resources = [(source / name, bundle / 'Resources/pipeline' / name)
                       for name in sorted(set(SOURCES.values()) | {'helper_identity.py', 'requirements.txt', 'STOP_AUDIO_PIPELINE.command'})]
          resources += [(source / 'mac-app/Info.plist', bundle / 'Info.plist'),
                        (source / 'mac-app/NovaMusicAudioHelper', bundle / 'MacOS/NovaMusicAudioHelper')]
          for original, packaged in resources:
              raw = packaged.read_bytes()
              if raw != original.read_bytes():
                  raise SystemExit('Packaged Helper source mismatch: ' + packaged.name)
              entries.append({'path': str(packaged.relative_to(bundle)), 'byteLength': len(raw),
                              'digest': hashlib.sha256(raw).hexdigest(), 'status': 'OBSERVED_PACKAGE_BYTES'})
          report = {'entries': entries, 'approvedAnchor': 'UNVERIFIED',
                    'bundledPythonRuntime': False, 'bundledMLModels': False,
                    'bundledMLNativeLibraries': False, 'publicationEligible': False}
          (bundle / 'Resources/packaged-source-inventory.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
          /usr/bin/plutil -lint "$CONTENTS/Info.plist"
          /usr/bin/codesign --force --deep --sign - "$APP_ROOT"
          /usr/bin/codesign --verify --deep --strict "$APP_ROOT"
          ditto -c -k --sequesterRsrc --keepParent "$APP_ROOT" "$RUNNER_TEMP/Nova-Music-Audio-Helper-macOS.zip"

      - name: Record actual package and test-runtime evidence without approval
        shell: bash
        run: |
          "$RUNNER_TEMP/audio-test-venv/bin/python" tools/music-audio-pipeline/bundle_evidence.py --package-root "$RUNNER_TEMP/Nova Music Audio Helper.app" --scope PACKAGE_OBSERVATION > "$RUNNER_TEMP/helper-backend-evidence.json"
          python3 - "$RUNNER_TEMP/helper-backend-evidence.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print('Helper package evidence; interpreter/dependencies are CI TEST_ONLY, not bundled runtime')
          print(json.dumps({'publicationEligible': r['publicationEligible'], 'packageFiles': len(r['packageFiles']),
                           'dependencies': [{'name': d['name'], 'version': d.get('version'), 'status': d['status'], 'license': d['license']} for d in r['distributions']]}))
          PY
          /usr/bin/file "$RUNNER_TEMP/Nova Music Audio Helper.app/Contents/MacOS/NovaMusicAudioHelper" > "$RUNNER_TEMP/helper-architecture-evidence.txt"
          cat "$RUNNER_TEMP/helper-architecture-evidence.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Helper-backend-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/helper-backend-evidence.json
            ${{ runner.temp }}/helper-architecture-evidence.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNNOTARIZED-DO-NOT-LAUNCH-Nova-Music-Audio-Helper-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/Nova-Music-Audio-Helper-macOS.zip
          if-no-files-found: error
          retention-days: 14

      - name: Package inspectable local source for real-device verification
        if: ${{ hashFiles('verification/pr262/LOCAL_AUDIO_HELPER_SOURCE.md') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/PR262-Local-Audio-Helper-Source"
          mkdir -p "$ROOT"
          cp tools/music-audio-pipeline/{START_AUDIO_PIPELINE.command,STOP_AUDIO_PIPELINE.command,artifact_verification.py,runtime_evidence.py,local_distribution_entry.py,server.py,requirements.txt,helper_identity.py,dependency_identity.py,distribution_binding.py,runtime_inventory.py,demucs_child.py,demucs_parent.py,demucs_receipt.py,scoped_closure.py,inventory_aggregation.py} "$ROOT/"
          cp verification/pr262/LOCAL_AUDIO_HELPER_SOURCE.md "$ROOT/README.md"
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > "$ROOT/PRODUCT_HEAD.txt"
          chmod +x "$ROOT/"*.command
          ditto -c -k --sequesterRsrc --keepParent "$ROOT" "$RUNNER_TEMP/PR262-Local-Audio-Helper-Source.zip"

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('verification/pr262/LOCAL_AUDIO_HELPER_SOURCE.md') != '' }}
        with:
          name: PR262-Local-Audio-Helper-Source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/PR262-Local-Audio-Helper-Source.zip
          if-no-files-found: error
          retention-days: 14
