<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Nova Studio</title>
  <link rel="stylesheet" href="./style.css?v=1.4.7">
  <link rel="stylesheet" href="./nova-menu.css?v=1.1.5">
  <link rel="stylesheet" href="./nova-unified-ui.css?v=1.0.4">
  <link rel="stylesheet" href="./story-archive-image-placeholder.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-large-representative-image.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-overview.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-basic-status.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-image-management.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-related-cards.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-timeline.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-story-materials.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-home-unified.css?v=1.4.6">
  <link rel="stylesheet" href="./story-archive-search-enhancement.css?v=1.4.7">
  <link rel="stylesheet" href="./gemini-bridge.css?v=1.5.0">
  <link rel="stylesheet" href="./gemini-bridge-enhancement.css?v=1.5.1">
  <link rel="stylesheet" href="./story-archive-detail-polish.css?v=1.5.2">
  <link rel="stylesheet" href="./story-archive-mobile-final.css?v=1.5.8">
</head>
<body>
  <div class="nova-menu-root">
    <div class="nova-menu-bar">
      <button class="nova-menu-toggle" type="button" aria-label="メインメニューを開く" aria-controls="novaMenuPanel" aria-expanded="false">
        <span class="nova-menu-glyph" aria-hidden="true">☰</span>
        <span class="nova-menu-label" aria-hidden="true">MENU</span>
      </button>
    </div>
    <div class="nova-menu-scrim" hidden></div>
    <div class="nova-menu-panel" id="novaMenuPanel" role="navigation" aria-label="Nova Studio メインメニュー" aria-hidden="true" tabindex="-1">
      <div class="nova-menu-heading">
        <h2>MENU</h2>
        <button class="nova-menu-close" type="button" data-menu-close aria-label="メニューを閉じる"><span aria-hidden="true">×</span></button>
      </div>
      <button type="button" data-route="home">ホーム</button>
      <details class="nova-menu-group">
        <summary>制作Studio</summary>
        <div class="nova-menu-group-items">
          <button type="button" data-command="story-studio">Story Studio</button>
          <button type="button" data-command="prompt-studio" data-active-route="promptStudio">Prompt Studio</button>
          <button type="button" data-command="music-studio" data-active-route="music-studio">Music Studio</button>
          <button type="button" data-route="characters">Character Studio</button>
          <button type="button" data-route="worlds">Background Studio</button>
          <button type="button" data-command="voice-studio" data-active-route="voiceStudio">Voice Studio</button>
          <button type="button" data-command="video-studio">Video Studio</button>
          <button type="button" data-command="comic-studio">Comic Studio</button>
          <button type="button" data-command="line-sns-studio">LINE・SNS Studio</button>
          <button type="button" data-command="web-studio">Web Studio</button>
        </div>
      </details>
      <details class="nova-menu-group">
        <summary>管理・保管</summary>
        <div class="nova-menu-group-items">
          <button type="button" data-command="story-archive" data-active-route="storyArchive">Story Archive</button>
          <button type="button" data-command="production-dashboard" data-active-route="productionDashboard">Production Dashboard</button>
          <button type="button" data-route="universe">Universe</button>
        </div>
      </details>
      <details class="nova-menu-group">
        <summary>その他</summary>
        <div class="nova-menu-group-items">
          <button type="button" data-route="projects">プロジェクト</button>
          <button type="button" data-route="settings">設定</button>
          <button type="button" data-route="backup">バックアップ</button>
        </div>
      </details>
    </div>
  </div>
  <div id="app"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box"><button class="icon close" id="modalClose">✕ 閉じる</button><div id="modalBody"></div></div>
  </div>
  <script src="./data.js?v=1.4.5"></script>
  <script src="./storage.js?v=1.4.5"></script>
  <script src="./navigation.js?v=1.4.5"></script>
  <script src="./import-export.js?v=1.4.5"></script>
  <script src="./app.js?v=1.4.32"></script>
  <script src="./story-archive-recovery.js?v=1.4.5"></script>
  <script src="./route-render-fix.js?v=1.4.5"></script>
  <script src="./story-archive-direct-render.js?v=1.4.5"></script>
  <script src="./story-archive-form-fix.js?v=1.4.5"></script>
  <script src="./story-archive-image-placeholder.js?v=1.4.5"></script>
  <script src="./story-archive-single-image-entry.js?v=1.4.5"></script>
  <script src="./story-archive-empty-gallery.js?v=1.4.5"></script>
  <script src="./story-archive-overview.js?v=1.4.5"></script>
  <script src="./story-archive-basic-status.js?v=1.4.5"></script>
  <script src="./story-archive-image-management.js?v=1.4.5"></script>
  <script src="./story-archive-related-cards.js?v=1.4.5"></script>
  <script src="./story-archive-timeline.js?v=1.4.5"></script>
  <script src="./story-archive-story-materials.js?v=1.4.5"></script>
  <script src="./thread-importer.js?v=1.4.5"></script>
  <script src="./chatgpt-bridge.js?v=1.4.5"></script>
  <script src="./story-archive-home-unified.js?v=1.4.6"></script>
  <script src="./story-archive-search-enhancement.js?v=1.4.7"></script>
  <script src="./story-archive-search-mobile-fix.js?v=1.5.7"></script>
  <script src="./gemini-bridge.js?v=1.5.0"></script>
  <script src="./gemini-bridge-enhancement.js?v=1.5.1"></script>
  <script src="./nova-menu.js?v=1.0.3"></script>
</body>
</html>
