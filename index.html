  <link rel="stylesheet" href="./story-archive-overview.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-basic-status.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-image-management.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-related-cards.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-timeline.css?v=1.4.5">
  <link rel="stylesheet" href="./story-archive-story-materials.css?v=1.4.5">

<body>
  <div class="nova-menu-root">
    <div class="nova-menu-bar">
      <button class="nova-menu-toggle" type="button" aria-label="メインメニューを開く" aria-controls="novaMenuPanel" aria-expanded="false">
        <span class="nova-menu-glyph" aria-hidden="true">☰</span>
        <span class="nova-menu-label" aria-hidden="true">MENU</span>
      </button>
    </div>
    <div class="nova-menu-scrim" hidden></div>
    <div class="nova-menu-panel" id="novaMenuPanel" role="navigation" aria-label="Nova Studio メインメニュー" aria-hidden="true" tabindex="-1">
      <div class="nova-menu-heading">
        <h2>MENU</h2>
        <button class="nova-menu-close" type="button" data-menu-close aria-label="メニューを閉じる"><span aria-hidden="true">×</span></button>
      </div>
      <button type="button" data-route="home">Home（ホーム）</button>
      <details class="nova-menu-group">
        <summary>Creative Studios（制作Studio）</summary>
        <div class="nova-menu-group-items">
          <button type="button" data-command="story-studio" data-active-route="story-studio">Story Studio（物語制作室）</button>
          <button type="button" data-route="prompt-studio">Prompt Studio（プロンプト制作室）</button>
          <button type="button" data-command="music-studio" data-active-route="music-studio">Music Studio（音楽制作室）</button>
          <button type="button" data-route="character-studio">Character Studio（キャラクター制作室）</button>
          <button type="button" data-route="background-studio">Background Studio（背景制作室）</button>
          <button type="button" data-route="voice-studio">Voice Studio（音声制作室）</button>
          <button type="button" data-command="video-studio" data-active-route="video-studio">Video Studio（動画制作室）</button>
          <button type="button" data-command="comic-studio" data-active-route="comic-studio">Comic Studio（漫画制作室）</button>
          <button type="button" data-command="line-sns-studio" data-active-route="line-sns-studio">LINE / SNS Studio（LINE・SNS制作室）</button>
          <button type="button" data-command="web-studio" data-active-route="web-studio">Web Studio（Web制作室）</button>
        </div>
      </details>
      <details class="nova-menu-group">
        <summary>Management / Archive（管理・保管）</summary>
        <div class="nova-menu-group-items">
          <button type="button" data-command="story-archive" data-active-route="storyArchive">Story Archive（物語保管庫）</button>
          <button type="button" data-command="production-dashboard" data-active-route="productionDashboard">Production Dashboard（制作管理盤）</button>
          <button type="button" data-route="universe">Universe（作品関係図）</button>
        </div>
      </details>
      <details class="nova-menu-group">
        <summary>Other（その他）</summary>
        <div class="nova-menu-group-items">
          <button type="button" data-route="projects">Project（プロジェクト）</button>
          <button type="button" data-route="settings">Settings（設定）</button>
          <button type="button" data-route="backup">Backup（バックアップ）</button>
        </div>
      </details>
      <div class="nova-menu-logo" aria-hidden="true">
        <img src="./assets/images/home/nova-studio-home-logo-20260804.png" alt="">
      </div>
    </div>
  </div>
  <div id="app"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box"><button class="icon close" id="modalClose">✕ 閉じる</button><div id="modalBody"></div></div>
  </div>
  <script src="./data.js?v=1.4.5"></script>
  <script src="./storage.js?v=1.4.5"></script>
  <script src="./navigation.js?v=1.4.5"></script>
  <script src="./import-export.js?v=1.4.5"></script>
  <script src="./app.js?v=1.5.24"></script>
  <script src="./story-archive-recovery.js?v=1.4.5"></script>
  <script src="./route-render-fix.js?v=1.4.5"></script>
  <script src="./story-archive-direct-render.js?v=1.4.5"></script>

  <script src="./story-archive-single-image-entry.js?v=1.4.5"></script>

  <script src="./story-archive-overview.js?v=1.4.5"></script>

  <script src="./story-archive-image-management.js?v=1.4.5"></script>

  <script src="./story-archive-timeline.js?v=1.4.5"></script>
  <script src="./story-archive-story-materials.js?v=1.4.5"></script>
  <script src="./thread-importer.js?v=1.4.5"></script>
  <script src="./chatgpt-bridge.js?v=1.4.5"></script>
  <script src="./story-archive-home-unified.js?v=1.4.6"></script>
  <script src="./story-archive-search-enhancement.js?v=1.4.7"></script>
  <script src="./story-archive-search-mobile-fix.js?v=1.5.7"></script>
  <script src="./gemini-bridge.js?v=1.5.2"></script>
  <script src="./gemini-bridge-enhancement.js?v=1.5.1"></script>
  <script src="./nova-menu.js?v=1.1.0"></script>
</body>
</html>
